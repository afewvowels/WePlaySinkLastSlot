[wp-sink-last-slot]
title=Sink last slot
toggle-chest=Sink last slot
toggle-chest-tooltip=When on, this chest fills normally, but anything that lands in its last usable slot (just before the red limit bar, if set) is sent to the void. It never backs up.
toggle-tank=Void excess fluid
toggle-tank-tooltip=When on, this tank keeps its top __1__ units of space free by voiding any fluid above that line, so there's always room for more.

[mod-setting-name]
wp-sink-last-slot-chests-default-on=Sink chests by default
wp-sink-last-slot-tanks-default-on=Void tanks by default
wp-sink-last-slot-fluid-headroom=Tank headroom (fluid units)
wp-sink-last-slot-check-interval=Sink check interval (ticks)

[mod-setting-description]
wp-sink-last-slot-chests-default-on=Whether chests nobody has toggled sink their last slot. Chests you've toggled by hand keep their own setting.
wp-sink-last-slot-tanks-default-on=Whether storage tanks nobody has toggled void their excess fluid. Tanks you've toggled by hand keep their own setting.
wp-sink-last-slot-fluid-headroom=How much empty space a voiding tank keeps at the top. Tanks smaller than this keep 10% of their capacity free instead.
wp-sink-last-slot-check-interval=How often each sinking chest or tank is checked. Lower is faster but costs a little more UPS with lots of them.
